name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calcoli:
    name: Motori di calcolo e layout (${{ matrix.tz }})
    runs-on: ubuntu-latest

    # Le date sono la fonte di errore piu silenziosa di tutto il progetto:
    # new Date('2005-01-01') e UTC, quindi a ovest di Greenwich diventa il 2004
    # e i conteggi slittano di un giorno. Un bug del genere e gia successo, in
    # js/estratto-contributivo.js. Girando solo su ubuntu, che e UTC, la CI non
    # lo avrebbe mai visto: qui si eseguono gli stessi test a est e a ovest.
    strategy:
      fail-fast: false
      matrix:
        tz: ['UTC', 'America/Los_Angeles', 'Pacific/Kiritimati']

    env:
      TZ: ${{ matrix.tz }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # I test non hanno dipendenze: usano node:test e node:assert.
      - name: Esegui i test
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Il lastmod del sitemap viene da git log: serve la storia intera.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      # Se il layout generato differisce da quello versionato, qualcuno ha
      # modificato scripts/build-layout.js senza rieseguire npm run build.
      - name: Verifica che il layout sia rigenerato
        run: node scripts/applica-layout.js --check

      # Serve la storia completa per il lastmod preso da git.
      - name: Verifica che il sitemap sia rigenerato
        run: node scripts/genera-sitemap.js --check

      - name: Compila Tailwind
        run: npm run build:css

      # Stesso discorso per il CSS rispetto a src/input.css.
      - name: Verifica che css/styles.css sia aggiornato
        run: git diff --exit-code css/styles.css
