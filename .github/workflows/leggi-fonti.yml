name: Leggi fonti ufficiali

# Alcuni siti ufficiali (ACI, Regioni, Agenzia delle Entrate) non sono
# raggiungibili dagli ambienti in cui si sviluppa il sito. Questo workflow
# scarica i documenti indicati e ne stampa il testo nel registro del job,
# cosi' le cifre (tariffe, aliquote, soglie) si verificano sul documento
# originale prima di aggiornare i file in data/. Non scrive niente nel
# repository.
on:
  workflow_dispatch:
    inputs:
      indirizzi:
        description: 'Indirizzi https dei documenti, separati da spazi'
        required: true
      modo:
        description: 'testo (stampa il documento) o stato (solo codice HTTP, indirizzo finale e titolo: per controllare i collegamenti)'
        required: false
        default: 'testo'

permissions:
  contents: read

jobs:
  leggi:
    name: Scarica e stampa il testo
    runs-on: ubuntu-latest
    env:
      INDIRIZZI: ${{ inputs.indirizzi }}
      MODO: ${{ inputs.modo }}
    steps:
      # Un collegamento vale se risponde 200 e se la pagina finale e' quella
      # giusta: Normattiva, per un URN che non esiste, risponde 200 con una
      # pagina d'errore. Per questo si stampano anche indirizzo finale e titolo.
      - name: Stato dei collegamenti
        if: ${{ inputs.modo == 'stato' }}
        run: |
          set -f
          for u in $INDIRIZZI; do
            case "$u" in https://*) ;; *) echo "SALTO $u"; continue ;; esac
            esito=$(curl -sSL --max-time 60 -A "Mozilla/5.0 (StrumentiUtili.it verifica fonti)" -o pagina -w '%{http_code} %{url_effective}' "$u" 2>&1 || true)
            titolo=$(tr -d '\r\n' < pagina 2>/dev/null | grep -oiE '<title[^>]*>[^<]{0,200}' | head -1 | sed -E 's/<title[^>]*>//I' | tr -s ' \t')
            errore=$(grep -oiE 'atto non (trovato|presente)|nessun (atto|documento) trovato|pagina non trovata|page not found|documento non disponibile' pagina 2>/dev/null | head -1)
            printf 'STATO\t%s\t%s\t%s\t[%s]\n' "$u" "$esito" "$titolo" "$errore"
          done

      - name: Installa pdftotext
        if: ${{ inputs.modo != 'stato' }}
        run: sudo apt-get install -y -qq poppler-utils > /dev/null

      - name: Testo dei documenti
        if: ${{ inputs.modo != 'stato' }}
        run: |
          set -f
          for u in $INDIRIZZI; do
            case "$u" in https://*) ;; *) echo "Salto $u (solo https)"; continue ;; esac
            echo "=== INIZIO $u"
            if ! curl -sSL --max-time 90 -A "Mozilla/5.0 (StrumentiUtili.it verifica fonti)" -o documento "$u"; then
              echo "ERRORE: download non riuscito"; echo "=== FINE $u"; continue
            fi
            if head -c 5 documento | grep -q '%PDF'; then
              pdftotext -layout documento - | head -c 400000
            else
              # prima i collegamenti ai documenti (tariffari, delibere), che
              # togliendo i tag andrebbero persi
              echo "--- collegamenti a PDF nella pagina:"
              grep -oiE 'href="[^"]+\.pdf[^"]*"' documento | sed -e 's/^href="//I' -e 's/"$//' | sort -u | head -100
              # alcuni portali (Liferay) servono i PDF da indirizzi senza
              # ".pdf": si riconoscono dal testo del collegamento
              echo "--- collegamenti a tariffe e tabelle:"
              grep -oiE "<a [^>]*href=[\"'][^\"']+[\"'][^>]*>[^<]{0,200}" documento \
                | grep -iE 'pdf|tariff|tabell|importi|get_file|/documents/' \
                | sed -E "s/<a [^>]*href=[\"']([^\"']+)[\"'][^>]*>(.*)/\1  «\2»/I" | sort -u | head -150
              echo "--- testo della pagina:"
              sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<[^>]*>/ /g' documento | tr -s ' \t' | grep -v '^\s*$' | head -c 200000
            fi
            echo
            echo "=== FINE $u"
          done
