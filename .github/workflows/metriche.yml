name: Qualità del sito (misure settimanali)

# Ogni domenica sera misura tutte le pagine del sitemap sul sito pubblicato,
# con un browser vero: telefono a 390 px, CPU rallentata 4 volte, rete mobile,
# annunci e consenso veri. Scrive solo issue (mai nel repository):
# - la issue fissata «Qualità del sito (misure settimanali)» con il rapporto;
# - una issue «qualita» + «priorita:alta» per ogni problema grave nuovo.
# Il mercoledi' il laboratorio settimanale (.claude/skills/laboratorio/) parte
# da qui per scegliere cosa migliorare. Con il segreto PSI_KEY (chiave gratuita
# delle API di Google con «Chrome UX Report API» attiva) si aggiungono i dati
# degli utenti reali e il segnale di quali pagine hanno traffico.
# Poi scripts/qualita/google.js guarda il sito come Google: ogni pagina
# scaricata come Googlebot (noindex, canonical, risposte) e, con il segreto
# GSC_CREDENZIALI (chiave JSON di un account di servizio aggiunto agli utenti
# di Search Console), lo stato di ogni pagina nell'indice, il motivo se ne e'
# fuori, clic e impressioni.
# A mano, con modo=google, gira solo questo controllo (un paio di minuti) e
# stampa il risultato nel registro, senza toccare le issue.
on:
  schedule:
    - cron: '17 20 * * 0'
  workflow_dispatch:
    inputs:
      modo:
        description: 'completo (misure e issue) o google (solo indice e Googlebot, nel registro)'
        required: false
        default: 'completo'

permissions:
  contents: read
  issues: write

concurrency:
  group: metriche
  cancel-in-progress: false

jobs:
  misura:
    name: Misura le pagine
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Solo Google (nel registro)
        if: ${{ inputs.modo == 'google' }}
        env:
          GSC_CREDENZIALI: ${{ secrets.GSC_CREDENZIALI }}
        run: node scripts/qualita/google.js --sito https://strumentiutili.it --solo-registro

      - name: Browser per le misure
        if: ${{ inputs.modo != 'google' }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null

      - name: Misura
        if: ${{ inputs.modo != 'google' }}
        env:
          PSI_KEY: ${{ secrets.PSI_KEY }}
        run: node scripts/qualita/misura.js --sito https://strumentiutili.it --uscita misure.json

      - name: Come la vede Google
        if: ${{ inputs.modo != 'google' }}
        env:
          GSC_CREDENZIALI: ${{ secrets.GSC_CREDENZIALI }}
        run: node scripts/qualita/google.js --sito https://strumentiutili.it --misure misure.json

      - name: Aggiorna le issue
        if: ${{ inputs.modo != 'google' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qualita/rapporto-issue.js misure.json

      - name: Conserva le misure
        if: ${{ always() && inputs.modo != 'google' }}
        uses: actions/upload-artifact@v4
        with:
          name: misure
          path: misure.json
          if-no-files-found: ignore
          retention-days: 90
